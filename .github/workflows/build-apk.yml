name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK (debug-signed, fine for personal sideloading)
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ReelMonster.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ReelMonster-debug-apk
          path: ReelMonster.apk

      - name: Build signed release APK (only if signing secrets exist)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            gradle :app:assembleRelease --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk ReelMonster-release.apk
          else
            echo "No signing secrets configured; skipping release build."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ReelMonster-release-apk
          path: ReelMonster-release.apk
          if-no-files-found: ignore
